<app-auth-card title="Welcome Back" subtitle="Log in to continue to Loopback!">
  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5">
    <label class="block">
      <span class="field-label">Organization</span>
      <select formControlName="organizationName">
        <option value="">Select your organization</option>

        @for (organization of organizationList; track organization.name) {
          <option [value]="organization.name">
            {{ organization.name }}
          </option>
        }
      </select>
      @if (form.controls.organizationName.touched && form.controls.organizationName.invalid) {
        <small class="field-error">Select Your Organization</small>
      }
    </label>

    <label class="block">
      <span class="field-label">Email</span>
      <input
        type="email"
        formControlName="email"
        placeholder="you@example.com"
        class="field-input"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Enter a valid email</small>
      }
    </label>

    <label class="block">
      <span class="field-label">Password</span>
      <input
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="field-input"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Password is required</small>
      }
    </label>

    @if (error()) {
      <p class="alert-error">
        {{ error() }}
      </p>
    }

    <button type="submit" [disabled]="loading" class="btn-primary">Login</button>
  </form>

  <p class="mt-6 text-center text-sm text-muted">
    No account?
    <a routerLink="/register" class="font-medium text-accent hover:text-accent-hover"> Register </a>
  </p>
</app-auth-card>
