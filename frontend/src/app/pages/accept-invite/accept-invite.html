<app-auth-card
  [title]="info() ? 'Join ' + info()!.organizationName : 'Accept invite'"
  subtitle="Choose a password to finish creating your account"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5">
    <div>
      <span class="field-label">Email</span>
      <p class="field-input opacity-70">{{ info()!.email }}</p>
    </div>

    <label class="block">
      <span class="field-label">Password</span>
      <input
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="field-input"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Use at least 8 characters</small>
      }
    </label>

    <label class="block">
      <span class="field-label">Confirm password</span>
      <input
        type="password"
        formControlName="confirmPassword"
        placeholder="••••••••"
        class="field-input"
      />
      @if (form.controls.confirmPassword.touched) {
        @if (form.controls.confirmPassword.hasError('required')) {
          <small class="field-error">Confirm your password</small>
        } @else if (form.hasError('passwordsMismatch')) {
          <small class="field-error">Passwords don't match</small>
        }
      }
    </label>

    <button type="submit" class="btn-primary">Create account</button>
  </form>
</app-auth-card>
